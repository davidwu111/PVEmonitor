# PVEmonitor configuration
# All paths are relative to PVEMONITOR_HOME unless absolute.

monitor:
  sample_interval_s: 10
  hostname_override: null       # defaults to socket.gethostname()
  collection_timeout_s: 25      # max time for one full collection run

paths:
  db: runtime/db/metrics.sqlite3
  log: runtime/logs/collector.log
  lock: runtime/locks/collector.lock

collection:
  host_enabled: true
  guests_enabled: true
  gpu_enabled: true
  psi_enabled: true
  top_process_enabled: true

gpu:
  rocm_smi_bin: /usr/bin/rocm-smi
  nvidia_smi_bin: null           # null = auto-detect from PATH; set to override
  sysfs_fallback: true

rate_calculation:
  max_interval_s: 120           # max seconds between samples for valid rate calc

logging:
  level: INFO
  max_log_bytes: 10485760       # 10 MB
  backup_count: 5

api:
  host: "0.0.0.0"
  port: 8806
  auth_token: ""                # empty = no auth; set to shared secret for LAN access control

# Stale lock detection
locking:
  stale_timeout_multiplier: 5   # stale = older than 5 × sample_interval_s

retention:
  raw_days: 30                  # keep full-resolution samples for 30 days
  rollup_1m_days: 90            # 1-minute rollups for medium-range charts
  rollup_5m_days: 365           # 5-minute rollups for long-range charts
  maintenance_interval_samples: 360  # prune roughly hourly at 10s sampling

# Telemetry is kept in memory (no per-sample disk writes).
# Snapshots are full copies written to disk on an interval and on shutdown.
storage:
  memory_limit_mb: 256           # hard cap on estimated telemetry memory usage
  snapshot_enabled: true         # false = run memory-only, no disk snapshots
  snapshot_interval_minutes: 60  # how often a full snapshot is written
  snapshot_keep: 7               # number of snapshot files to retain
  snapshot_dir: runtime/exports/snapshots
  import_legacy_db: true         # one-time import of runtime/db/metrics.sqlite3
