[project]
name = "pvemonitor"
version = "0.1.0"
requires-python = ">=3.11"
description = "Lightweight Proxmox VE host and guest monitor for AI workloads"
dependencies = [
    "fastapi>=0.115.0,<1.0.0",
    "uvicorn[standard]>=0.34.0,<1.0.0",
    "pyyaml>=6.0",
]

[project.scripts]
pvemonitor = "pvemonitor.cli:main"

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
